name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # pyproject.toml lives in backend/, so every command below runs from
    # there. The workflow file itself must stay at the repository root:
    # GitHub only reads .github/workflows/ from the root. `uses:` steps
    # are unaffected by this default, which is what we want since
    # checkout has to happen at the root.
    defaults:
      run:
        working-directory: backend

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check kalsangati/ tests/

      - name: Type check with mypy
        run: mypy kalsangati/

      - name: Run tests
        run: pytest --cov=kalsangati --cov-report=term-missing
